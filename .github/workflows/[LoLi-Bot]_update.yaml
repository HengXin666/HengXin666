name: '[LoLi-Bot] 每日任务, 始まるざますよ、行くて関す'

on:
  push:
    paths-ignore:
      - 'README.md'
  schedule:
    # 每天北京时间凌晨 00:00 运行 (UTC 16:00)
    # 和您原来的时间保持一致
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'WakaTime 执行模式: default, week, full'
        required: true
        default: 'default'
        type: choice
        options:
        - default
        - week
        - full

jobs:
  update:
    # 防循环触发条件
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null && !contains(github.event.head_commit.message, '[LoLi-Bot]'))

    runs-on: ubuntu-latest

    environment: LoLi-Bot

    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 设置双环境: Node.js 和 Python
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 顺序执行任务一: WakaTime 数据同步
      - name: Install Python dependencies
        run: pip install requests pillow

      - name: 运行 WakaTime 同步脚本
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKA_MODE: ${{ github.event.inputs.mode || 'default' }}
        run: python py/wakatime_req.py

      # 4. 主页卡片: 先备齐三份数据 (GitHub 统计 / 追番封面清单 / RSS), 再一次性渲染 README 与 img/cards/
      #    卡片全部由 scripts/profile/ 自己画, 不再拉第三方 (github-readme-stats 等) 卡片.
      - name: 安装 Node.js 依赖
        run: npm i

      # GH_STATS_TOKEN (可选, 本人 classic PAT, 勾 read:user 即可): 私有仓库贡献也算进来, 卡片上分开标 "公开 / 私有";
      # 没配就用自带的 GITHUB_TOKEN, 卡片标 "仅公开". 每次运行约 4~8 次 GraphQL 请求, 远低于每小时 5000 点的额度.
      # 拉取失败时保留旧 data/github.json.
      - name: 拉取 GitHub 统计
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --loader ts-node/esm scripts/profile/fetchGithub.ts

      # HX-AIOA 里主账号的 GitHub 按天统计 (与手机端同源, 不用 GitHub 令牌); 没配 secrets 就跳过, 用上一步 GraphQL 的数
      - name: 拉取 AIOA GitHub 统计
        env:
          AIOA_SERVER: ${{ secrets.AIOA_SERVER }}
          AIOA_KEY: ${{ secrets.AIOA_KEY }}
        run: node --loader ts-node/esm scripts/profile/fetchAioa.ts

      # 追番: 匿名 sparse 检出 HXLoLi-ANiMe 的轻量索引与封面, 生成「最近在看」每部一张的封面卡; 失败时保留旧卡片.
      - name: 检出追番数据 (HXLoLi-ANiMe)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: HengXin666/HXLoLi-ANiMe
          path: .anime-data
          sparse-checkout: |
            data/ANiMeIndex.json
            data/anime
          sparse-checkout-cone-mode: false

      - name: 生成追番封面卡
        env:
          ANIME_DATA_DIR: .anime-data/data
        run: python py/anime_card.py || true

      - name: 清理追番数据检出
        if: always()
        run: rm -rf .anime-data

      - name: 渲染 README 与卡片
        run: node --loader ts-node/esm scripts/updateReadme.ts

      # 5. 统一提交所有变更
      - name: 召唤 萝莉小猫娘
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # 使用您的机器人名称作为提交信息
          commit_message: '[LoLi-Bot]: ご主人さま　毎日のアップデート にゃ~　(GitHub & WakaTime & Blog & ANiMe)'
          # 设置为您指定的 Git 用户身份
          commit_user_name: 'Heng_Xin[LoLi-Bot]'
          commit_user_email: '282000500@qq.com'
          commit_author: 'Heng_Xin[LoLi-Bot] <282000500@qq.com>'
