<svg xmlns="http://www.w3.org/2000/svg" width="792" height="76" viewBox="0 0 792 76" role="img" aria-label="语言占比"><title>语言占比</title><style>
svg{--fg:#1f2328;--mute:#59636e;--faint:#818b98;--line:#d1d9e0;--card:#f6f8fa;--card2:#ffffff;--pk:#c026d3;--pu:#8250df;--or:#d1580b;--gr:#1a7f37;--cy:#0969da;--glow:#f0abfc}
@media (prefers-color-scheme:dark){svg{--fg:#e6edf3;--mute:#9198a1;--faint:#6e7681;--line:#30363d;--card:#161b22;--card2:#0d1117;--pk:#ff88ff;--pu:#bc8cff;--or:#f0883e;--gr:#3fb950;--cy:#58c4ff;--glow:#ff88ff}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,'PingFang SC','Hiragino Sans','Microsoft YaHei','Noto Sans CJK SC',sans-serif}text:not([fill]){fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-variant-numeric:tabular-nums}
text.mute{fill:var(--mute)}text.faint{fill:var(--faint)}
.card{fill:var(--card);stroke:var(--line)}
.in{opacity:0;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.4,0,.2,1) .2s forwards}
.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) .3s forwards}
.rise{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes rise{to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.draw{stroke-dashoffset:0}.grow,.rise{transform:none}}
</style><defs><clipPath id="b"><rect x="16" y="38" width="760" height="12" rx="6"/></clipPath></defs><rect class="card" x="0.5" y="0.5" width="791" height="75" rx="14"/><g transform="translate(16 11) scale(0.625)" fill="none" stroke="var(--pk)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></g><text x="38" y="23" font-size="14" font-weight="600">语言占比</text><text class="faint" x="102" y="23" font-size="11">91 个自有仓库, 按代码字节</text><text class="mute" x="776" y="23" font-size="12" text-anchor="end">Python 32% / TypeScript 29% / C++ 16% / Go 7%</text><rect x="16" y="38" width="760" height="12" rx="6" fill="var(--line)" opacity=".5"/><g clip-path="url(#b)"><rect class="grow" x="16.0" y="38" width="241.9" height="12" fill="#3572A5" style="animation-delay:0.15s"><title>Python 32.0%</title></rect><rect class="grow" x="259.4" y="38" width="218.6" height="12" fill="#3178c6" style="animation-delay:0.24s"><title>TypeScript 29.0%</title></rect><rect class="grow" x="479.6" y="38" width="122.0" height="12" fill="#f34b7d" style="animation-delay:0.33s"><title>C++ 16.3%</title></rect><rect class="grow" x="603.1" y="38" width="53.7" height="12" fill="#00ADD8" style="animation-delay:0.42s"><title>Go 7.3%</title></rect><rect class="grow" x="658.3" y="38" width="37.1" height="12" fill="#e34c26" style="animation-delay:0.51s"><title>HTML 5.1%</title></rect><rect class="grow" x="696.8" y="38" width="33.5" height="12" fill="#f1e05a" style="animation-delay:0.60s"><title>JavaScript 4.6%</title></rect><rect class="grow" x="731.8" y="38" width="19.0" height="12" fill="#A97BFF" style="animation-delay:0.69s"><title>Kotlin 2.7%</title></rect><rect class="grow" x="752.4" y="38" width="9.0" height="12" fill="#663399" style="animation-delay:0.78s"><title>CSS 1.4%</title></rect><rect class="grow" x="762.8" y="38" width="5.4" height="12" fill="#89e051" style="animation-delay:0.87s"><title>Shell 0.9%</title></rect><rect class="grow" x="769.7" y="38" width="0.7" height="12" fill="#4F5D95" style="animation-delay:0.96s"><title>PHP 0.3%</title></rect><rect class="grow" x="771.9" y="38" width="0.6" height="12" fill="#44a51c" style="animation-delay:1.05s"><title>QML 0.3%</title></rect><rect class="grow" x="774.0" y="38" width="0.5" height="12" fill="#8b949e" style="animation-delay:1.14s"><title>NASL 0.3%</title></rect></g><text class="faint" x="16" y="66" font-size="10">点下方语言看对应仓库</text></svg>
