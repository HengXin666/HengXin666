<svg xmlns="http://www.w3.org/2000/svg" width="792" height="76" viewBox="0 0 792 76" role="img" aria-label="语言占比"><title>语言占比</title><style>
svg{--fg:#1f2328;--mute:#59636e;--faint:#818b98;--line:#d1d9e0;--card:#f6f8fa;--card2:#ffffff;--pk:#c026d3;--pu:#8250df;--or:#d1580b;--gr:#1a7f37;--cy:#0969da;--glow:#f0abfc}
@media (prefers-color-scheme:dark){svg{--fg:#e6edf3;--mute:#9198a1;--faint:#6e7681;--line:#30363d;--card:#161b22;--card2:#0d1117;--pk:#ff88ff;--pu:#bc8cff;--or:#f0883e;--gr:#3fb950;--cy:#58c4ff;--glow:#ff88ff}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,'PingFang SC','Hiragino Sans','Microsoft YaHei','Noto Sans CJK SC',sans-serif}text:not([fill]){fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-variant-numeric:tabular-nums}
text.mute{fill:var(--mute)}text.faint{fill:var(--faint)}
.card{fill:var(--card);stroke:var(--line)}
.in{opacity:0;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.4,0,.2,1) .2s forwards}
.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) .3s forwards}
.rise{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
.twk{transform-box:fill-box;transform-origin:center;opacity:0;animation:twk 3s ease-in-out infinite}
.breathe{animation:breathe 3.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(90deg)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes rise{to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.draw{stroke-dashoffset:0}.grow,.rise{transform:none}}
</style><defs><clipPath id="b"><rect x="16" y="38" width="760" height="12" rx="6"/></clipPath></defs><rect class="card" x="0.5" y="0.5" width="791" height="75" rx="14"/><g transform="translate(16 11) scale(0.625)" fill="none" stroke="var(--pk)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></g><text x="38" y="23" font-size="14" font-weight="600">语言占比</text><text class="faint" x="102" y="23" font-size="11">69 个自有仓库, 按代码字节</text><text class="mute" x="776" y="23" font-size="12" text-anchor="end">TypeScript 44% / Python 19% / C++ 12% / Go 11%</text><rect x="16" y="38" width="760" height="12" rx="6" fill="var(--line)" opacity=".5"/><g clip-path="url(#b)"><rect class="grow" x="16.0" y="38" width="333.2" height="12" fill="#3178c6" style="animation-delay:0.15s"><title>TypeScript 44.0%</title></rect><rect class="grow" x="350.7" y="38" width="142.6" height="12" fill="#3572A5" style="animation-delay:0.24s"><title>Python 19.0%</title></rect><rect class="grow" x="494.8" y="38" width="89.8" height="12" fill="#f34b7d" style="animation-delay:0.33s"><title>C++ 12.0%</title></rect><rect class="grow" x="586.1" y="38" width="81.1" height="12" fill="#00ADD8" style="animation-delay:0.42s"><title>Go 10.9%</title></rect><rect class="grow" x="668.7" y="38" width="35.8" height="12" fill="#A97BFF" style="animation-delay:0.51s"><title>Kotlin 4.9%</title></rect><rect class="grow" x="705.9" y="38" width="24.7" height="12" fill="#f1e05a" style="animation-delay:0.60s"><title>JavaScript 3.4%</title></rect><rect class="grow" x="732.1" y="38" width="14.4" height="12" fill="#663399" style="animation-delay:0.69s"><title>CSS 2.1%</title></rect><rect class="grow" x="748.0" y="38" width="10.7" height="12" fill="#e34c26" style="animation-delay:0.78s"><title>HTML 1.6%</title></rect><rect class="grow" x="760.2" y="38" width="5.9" height="12" fill="#89e051" style="animation-delay:0.87s"><title>Shell 1.0%</title></rect><rect class="grow" x="767.6" y="38" width="2.3" height="12" fill="#44a51c" style="animation-delay:0.96s"><title>QML 0.5%</title></rect><rect class="grow" x="771.3" y="38" width="1.4" height="12" fill="#4F5D95" style="animation-delay:1.05s"><title>PHP 0.4%</title></rect><rect class="grow" x="774.3" y="38" width="0.5" height="12" fill="#41b883" style="animation-delay:1.14s"><title>Vue 0.2%</title></rect><style>.stp{animation:stp 1.6s linear infinite}@keyframes stp{to{transform:translateX(16.97px)}}</style><pattern id="st" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="12" fill="#fff" opacity=".22"/></pattern><rect class="stp" x="-24" y="38" width="840" height="12" fill="url(#st)"/></g><text class="faint" x="16" y="66" font-size="10">点下方语言看对应仓库</text></svg>
